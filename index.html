<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GW Studio</title>
<meta name="description" content="GW Studio — tools for making and finishing music.">
<meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GW Studio">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" href="icon-192.png?v=3">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080f; --ink: #f4ede4; --dim: #c7bfb4; --faint: #a39bb0;
    --card: #12131d; --card-hi: #191a27; --line: #262433; --line-hi: #3a3548;
    --gold: #fbb33c; --hot: #ec6a3a; --blue: #a9b8ff; --ok: #3ecf8e;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* ---------- hero ---------- */
  .hero { position: relative; overflow: hidden;
    padding: calc(env(safe-area-inset-top) + 26px) 20px 0; }
  #ridges { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 300px; display: block; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
    background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none; }
  .hero-in { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding-bottom: 210px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .brand span { color: var(--gold); }
  .tag { margin: 34px 0 14px; font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold);
    display: flex; align-items: center; gap: 8px; }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px #3ecf8e33;
    animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px #3ecf8e00; } }
  h1 { margin: 0; font-size: clamp(44px, 13vw, 76px); line-height: .94; letter-spacing: -.05em; font-weight: 800; }
  h1 em { font-style: normal; background: linear-gradient(90deg, var(--gold), var(--hot));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { margin: 16px 0 0; color: var(--dim); font-size: 17px; max-width: 420px; }

  /* ---------- body ---------- */
  main { position: relative; z-index: 2; max-width: 640px; margin: -96px auto 0;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 40px); }
  .search { display: block; position: sticky; top: calc(env(safe-area-inset-top) + 10px); z-index: 5; margin-bottom: 6px; }
  .search input { width: 100%; height: 52px; padding: 0 20px 0 48px; font: 500 16px Inter, sans-serif; color: var(--ink);
    background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line-hi); border-radius: 999px; outline: none; -webkit-appearance: none; transition: box-shadow .2s, border-color .2s; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--gold); box-shadow: 0 0 0 6px #fbb33c33; }
  .search svg { position: absolute; left: 18px; top: 50%; translate: 0 -50%; width: 18px; height: 18px;
    stroke: var(--faint); fill: none; stroke-width: 2; stroke-linecap: round; z-index: 1; pointer-events: none; }

  .sec-h { display: flex; align-items: baseline; gap: 10px; margin: 34px 6px 14px;
    font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .sec-h b { color: var(--hot); }
  .sec-h .count { margin-left: auto; color: #6c6475; }

  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    margin-bottom: 12px; overflow: hidden; transition: border-color .2s, transform .15s; }
  .card:active { transform: scale(.985); }
  .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--c) 16%, transparent), transparent 55%); }
  a.main { position: relative; display: flex; align-items: center; gap: 14px; padding: 16px; }
  .ico { flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 14%, #0c0d15); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .ico svg { width: 22px; height: 22px; stroke: var(--c); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .txt { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 17px; letter-spacing: -.015em; }
  .url { font: 500 12px var(--mono); color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .go { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-hi); }
  .go svg { width: 14px; height: 14px; stroke: var(--dim); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .chips { position: relative; display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px 76px; }
  .chips a { font: 600 13px Inter, sans-serif; color: var(--dim); padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line-hi); background: #0c0d15; }
  .chips a:active { color: var(--ink); border-color: var(--c); }

  /* featured */
  .card.feat { border-color: #4a3f52; box-shadow: 0 0 0 1px #fbb33c22, 0 20px 50px -20px #fbb33c40; }
  .card.feat .name { font-size: 20px; }
  .card.feat .go { background: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 5px #fbb33c40; }
  .card.feat .go svg { stroke: var(--bg); }

  .music { --c: var(--gold); } .biz { --c: var(--blue); } .life { --c: var(--ok); } .hot { --c: var(--hot); }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--faint); padding: 30px 0; font: 500 14px var(--mono); }
  footer { margin-top: 40px; text-align: center; font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #6c6475; }
  footer span { color: var(--gold); }

  /* ---------- desktop ---------- */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .grid .card { margin-bottom: 0; }
  @media (min-width: 760px) {
    .hero { padding-left: 40px; padding-right: 40px; }
    .hero-in { max-width: 1240px; padding-top: 30px; padding-bottom: 330px; }
    main { max-width: 1320px; }
    #ridges { height: 420px; }
    .tag { margin-top: 70px; }
    h1 { font-size: clamp(76px, 8.5vw, 132px); }
    .lede { font-size: 20px; max-width: 560px; }
    main { padding: 0 40px 60px; margin-top: -120px; }
    .search { max-width: 560px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
    .card.feat { grid-column: 1 / -1; }
    .card.feat a.main { padding: 26px; }
    .card.feat .ico { width: 60px; height: 60px; border-radius: 16px; }
    .card.feat .ico svg { width: 28px; height: 28px; }
    .card.feat .name { font-size: 26px; }
    .card.feat .chips { padding: 0 26px 26px 112px; margin-top: -12px; }
    .sec-h { margin-top: 52px; }
    a.main:hover { background: #ffffff05; }
    .card:hover { border-color: var(--line-hi); transform: translateY(-2px); }
    .card.feat:hover { border-color: #6a5a62; }
    .chips a:hover { color: var(--ink); border-color: var(--c); }
    .card { transition: border-color .2s, transform .2s; }
  }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="hero">
  <canvas id="ridges" aria-hidden="true"></canvas>
  <div class="hero-in">
    <div class="brand"><img src="apple-touch-icon.png?v=3" alt=""><div>GW<span>Studio</span></div></div>
    <p class="tag"><i></i>GW Studio</p>
    <h1>What are you<br><em>looking for?</em></h1>
    <p class="lede">Pick a tool and get started.</p>
  </div>
</div>

<main>
  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" id="q" placeholder="Search tools" autocomplete="off" aria-label="Search pages">
  </label>

  <section>
    <div class="sec-h"><b>01</b> Featured <span class="count"></span></div>
    <div class="grid">
    <div class="card music feat">
      <a class="main" href="https://masterscope.gwstudio.com.au/">
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5 12h2l1.5-4 2.5 9 2-12 2 9 1.5-2H19"/></svg></div>
        <div class="txt"><div class="name">MasterScope</div><div class="url">masterscope.gwstudio.com.au</div></div>
        <div class="go"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
      </a>
      <div class="chips">
        <a href="https://masterscope.gwstudio.com.au/meter/">Meter</a>
        <a href="https://masterscope.gwstudio.com.au/liminal/">Liminal</a>
        <a href="https://masterscope.gwstudio.com.au/liminal/guide/">Liminal guide</a>
        <a href="https://masterscope.gwstudio.com.au/learn/">Learn</a>
      </div>
    </div>
    </div>
  </section>

  <p class="empty hidden" id="empty">Nothing matches that.</p>
  <footer>gwstudio<span>.</span>com<span>.</span>au</footer>
</main>

<script>
/* ---------- search + counts ---------- */
(() => {
  const q = document.getElementById('q'), empty = document.getElementById('empty');
  const secs = [...document.querySelectorAll('main section')];
  const count = () => {
    let total = 0;
    secs.forEach(s => {
      const n = s.querySelectorAll('.card:not(.hidden)').length;
      s.querySelector('.count').textContent = String(n).padStart(2, '0');
      s.classList.toggle('hidden', !n); total += n;
    });
    empty.classList.toggle('hidden', total > 0);
  };
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('hidden', !!t && !c.textContent.toLowerCase().includes(t)));
    count();
  });
  count();
})();

/* ---------- animated spectrum ridges ---------- */
(() => {
  const cv = document.getElementById('ridges'), ctx = cv.getContext('2d');
  if (!ctx) return;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, raf = 0, last = 0;
  const ROWS = 22, PTS = innerWidth > 900 ? 110 : 64;
  const size = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  const noise = (x, r, t) =>
    Math.sin(x * 9.1 + r * 1.7 + t * 0.9) * 0.5 + Math.sin(x * 23.3 - r * 0.6 + t * 1.6) * 0.3 +
    Math.sin(x * 41.0 + r * 2.9 - t * 2.3) * 0.2;
  const draw = (now) => {
    raf = 0;
    if (!still && now - last < 33) { loop(); return; }
    last = now;
    const t = now / 1000;
    ctx.clearRect(0, 0, W, H);
    const top = H * 0.30, bottom = H * 0.86, gap = (bottom - top) / ROWS;
    const amp = Math.min(H * 0.55, Math.min(W, 1400) * 0.11);
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, '#a9b8ff'); grad.addColorStop(.45, '#fbb33c'); grad.addColorStop(1, '#ec6a3a');
    for (let r = 0; r < ROWS; r++) {
      const y0 = top + r * gap, depth = r / (ROWS - 1);
      ctx.beginPath();
      for (let i = 0; i <= PTS; i++) {
        const x = i / PTS;
        const env = Math.pow(Math.sin(Math.PI * x), 3) * (0.55 + 0.45 * Math.sin(r * 0.7 + t * 0.5));
        const v = Math.max(0, noise(x, r, t) * 0.5 + 0.55) * env;
        const px = x * W, py = y0 - v * amp * (0.5 + depth * 0.7);
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.lineTo(W, y0 + 2); ctx.lineTo(0, y0 + 2); ctx.closePath();
      ctx.fillStyle = '#07080f'; ctx.fill();
      ctx.globalAlpha = 0.18 + depth * 0.7;
      ctx.strokeStyle = grad; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (!still) loop();
  };
  const loop = () => { if (!raf && !document.hidden) raf = requestAnimationFrame(draw); };
  size(); addEventListener('resize', () => { size(); if (still) draw(performance.now()); });
  document.addEventListener('visibilitychange', loop);
  still ? draw(performance.now()) : loop();
})();
</script>
</body>
</html>
